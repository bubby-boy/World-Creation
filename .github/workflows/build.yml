
name: Build WorldManager

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check project structure
        run: |
          echo "Checking plugin.yml..."
          find . -name plugin.yml
          test -f src/main/resources/plugin.yml

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Verify plugin.yml in JAR
        run: |
          jar tf target/WorldManager.jar
          jar tf target/WorldManager.jar | grep -x plugin.yml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldManager
          path: target/WorldManager.jar
